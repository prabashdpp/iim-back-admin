<VirtualHost *:80>
        ServerName dev.investinmoi-archnix
        ServerAlias www.dev.investinmoi-archnix
        ServerAdmin admin@setupserver.net
        DocumentRoot /var/www/html/invest_in_moi_back/public
        <Directory /var/www/html/invest_in_moi_back>
        Options -Indexes +FollowSymLinks +MultiViews
        AllowOverride All
        Require all granted
        IncludeOptional /etc/apache2/conf-available/000-default/location/root.*.conf;
    </Directory>

    <FilesMatch \.php$>
        #SetHandler "proxy:fcgi://127.0.0.1:107"
        IncludeOptional /etc/apache2/conf-available/000-default/location/php.*.conf;
    </FilesMatch>

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/log combined

        IncludeOptional /etc/apache2/conf-available/000-default/*.conf
</VirtualHost>
